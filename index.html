<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yaren</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background: radial-gradient(circle at top,#1b0033,#000);
    cursor:pointer;
    font-family:Cinzel;
}

/* INTRO */
#intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:2rem;
    text-align:center;
    transition:1s;
}

/* MAIN */
#main{
    display:none;
    width:100%;
    height:100%;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

/* IMAGE */
img{
    width:280px;
    height:380px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 50px rgba(255,0,150,0.4);
    z-index:2;
}

/* NAME */
h1{
    font-family:"Great Vibes";
    font-size:4rem;
    color:#ffb3e6;
    margin-top:20px;
}

/* HEARTS */
.heart{
    position:absolute;
    color:pink;
    font-size:20px;
    animation:float 6s linear forwards;
}

@keyframes float{
    0%{transform:translateY(0); opacity:1;}
    100%{transform:translateY(-100vh); opacity:0;}
}

/* PARTICLES */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:up 5s linear forwards;
}

@keyframes up{
    to{transform:translateY(-100vh); opacity:0;}
}

</style>
</head>

<body>

<div id="intro">Ekrana dokun ❤️</div>

<div id="main">

    <img src="fotograf.jpg">
    <h1>Yaren</h1>

    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

</div>

<script>

const intro = document.getElementById("intro");
const main = document.getElementById("main");
const music = document.getElementById("music");

document.body.addEventListener("click", () => {

    intro.style.opacity = 0;
    intro.style.transform = "scale(1.2)";

    setTimeout(()=>{
        intro.style.display = "none";
        main.style.display = "flex";
    },800);

    // MÜZİK (KESİN ÇALIŞAN)
    music.play().catch(()=>{});

    startEffects();

}, {once:true});

/* ❤️ KALPLER */
function startEffects(){

    setInterval(()=>{
        let h = document.createElement("div");
        h.className="heart";
        h.innerHTML="❤";
        h.style.left = Math.random()*100 + "vw";
        h.style.fontSize = (10+Math.random()*20)+"px";
        document.body.appendChild(h);

        setTimeout(()=>h.remove(),6000);
    },200);

/* ✨ PARTİKÜL */
    setInterval(()=>{
        let p = document.createElement("div");
        p.className="particle";
        p.style.left = Math.random()*100 + "vw";
        document.body.appendChild(p);

        setTimeout(()=>p.remove(),5000);
    },120);
}

</script>

</body>
</html>
