<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yaren'e Sürpriz</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    background: radial-gradient(circle at top,#1a0025,#000);
    cursor:pointer;
}

/* GİRİŞ */
#intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2rem;
    color:white;
    font-family:Cinzel;
    z-index:10;
}

/* KART */
#card{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

/* FOTO */
img{
    width:280px;
    height:380px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 40px rgba(255,0,150,0.5);
}

/* YAZI */
h1{
    font-family:"Great Vibes";
    font-size:4rem;
    color:#ffb3d9;
    margin-top:20px;
}

/* KALPLER */
.heart{
    position:absolute;
    color:pink;
    font-size:20px;
    animation: float 6s linear forwards;
}

@keyframes float{
    0%{transform:translateY(0) scale(1); opacity:1;}
    100%{transform:translateY(-100vh) scale(2); opacity:0;}
}

/* CONFETTI */
.confetti{
    position:absolute;
    width:8px;
    height:8px;
    animation: fall 3s linear forwards;
}

@keyframes fall{
    to{transform:translateY(100vh) rotate(360deg); opacity:0;}
}

/* LAZER CANVAS */
canvas{
    position:absolute;
    top:0;
    left:0;
}

</style>
</head>

<body>

<div id="intro">Ekrana dokun...</div>

<div id="card">
    <canvas id="canvas"></canvas>

    <img src="fotoğraf.jpg">
    <h1>Yaren ❤️</h1>

    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

<script>

const intro = document.getElementById("intro");
const card = document.getElementById("card");
const music = document.getElementById("music");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

document.body.addEventListener("click", () => {

    intro.style.display = "none";
    card.style.display = "flex";

    music.play().catch(()=>{});

    hearts();
    confetti();
    fireworks();
    drawHeart();

});

/* 💖 UÇAN KALPLER */
function hearts(){
    setInterval(()=>{
        let h = document.createElement("div");
        h.className="heart";
        h.innerHTML="❤";
        h.style.left=Math.random()*100+"vw";
        h.style.fontSize=(10+Math.random()*20)+"px";
        document.body.appendChild(h);

        setTimeout(()=>h.remove(),6000);
    },200);
}

/* 🎉 CONFETTI */
function confetti(){
    setInterval(()=>{
        let c = document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},100%,60%)`;
        document.body.appendChild(c);

        setTimeout(()=>c.remove(),3000);
    },80);
}

/* 🎆 HAVAİ FİŞEK */
function fireworks(){
    setInterval(()=>{
        for(let i=0;i<20;i++){
            let f = document.createElement("div");
            f.className="heart";
            f.innerHTML="✨";
            f.style.left="50vw";
            f.style.top="50vh";
            document.body.appendChild(f);

            setTimeout(()=>f.remove(),1500);
        }
    },2000);
}

/* 💘 LAZER KALP */
function drawHeart(){
    let t = 0;

    function animate(){
        requestAnimationFrame(animate);

        let x = 16 * Math.pow(Math.sin(t),3);
        let y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);

        ctx.fillStyle="rgba(255,0,100,0.5)";
        ctx.fillRect(canvas.width/2 + x*10, canvas.height/2 - y*10, 2,2);

        t += 0.05;
    }

    animate();
}

</script>

</body>
</html>
