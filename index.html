<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaren | Aşk Hikayesi</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:black;
    cursor:pointer;
    font-family:Cinzel;
}

/* INTRO */
#intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:2rem;
    text-align:center;
    background: radial-gradient(circle at center,#1a0033,#000);
}

/* MAIN */
#main{
    display:none;
    width:100%;
    height:100%;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

/* FOTO */
img{
    width:300px;
    height:420px;
    object-fit:cover;
    border-radius:25px;
    box-shadow:0 0 80px rgba(255,0,150,0.5);
    animation:zoom 5s ease forwards;
}

@keyframes zoom{
    from{transform:scale(1.2);}
    to{transform:scale(1);}
}

/* YAZI */
h1{
    font-family:"Great Vibes";
    font-size:4.5rem;
    color:#ffb3e6;
    margin-top:20px;
}

p{
    max-width:500px;
    color:#f6d6e6;
    line-height:1.6;
}

/* HEART */
.heart{
    position:absolute;
    color:pink;
    animation:float 6s linear forwards;
}

@keyframes float{
    0%{transform:translateY(0);opacity:1;}
    100%{transform:translateY(-100vh);opacity:0;}
}

</style>
</head>

<body>

<div id="intro">Bir aşk hikayesi başlıyor...</div>

<div id="main">

    <img src="fotograf.jpg">

    <h1>Yaren</h1>

    <p>
        Seni tanıdığım andan beri hayatım değişti.  
        Sen benim en güzel tesadüfümsün.  
        İyi ki varsın ❤️
    </p>

    <audio id="music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

</div>

<script>

const intro = document.getElementById("intro");
const main = document.getElementById("main");
const music = document.getElementById("music");

document.body.addEventListener("click", async () => {

    intro.style.opacity = 0;

    setTimeout(()=>{
        intro.style.display = "none";
        main.style.display = "flex";
    },800);

    try {
        music.load();
        await music.play();
        console.log("müzik çalıştı");
    } catch (e) {
        console.log("müzik engellendi", e);
    }

    startHearts();

}, {once:true});

/* ❤️ KALPLER */
function startHearts(){
    setInterval(()=>{
        let h = document.createElement("div");
        h.className="heart";
        h.innerHTML="❤";
        h.style.left=Math.random()*100+"vw";
        h.style.fontSize=(10+Math.random()*20)+"px";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    },200);
}

</script>

</body>
</html>
